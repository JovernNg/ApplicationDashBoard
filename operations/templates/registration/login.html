{% extends "operations/base.html" %}


{% block title %}
Login
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <h1 class="h3">
            Login
        </h1>


        {% if form.errors %}

        <div class="alert alert-danger">
            Invalid username or password.
        </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn btn-primary"
            >
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
